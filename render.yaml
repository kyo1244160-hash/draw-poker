# render.yaml — Render.com デプロイ設定
#
# 設定方法:
#   1. GitHubにこのリポジトリをプッシュ
#   2. Render.com で "New Web Service" を作成
#   3. リポジトリを選択してこのファイルが自動認識される
#
# 手動設定の場合:
#   Root Directory: (空白 = リポジトリルート)
#   Build Command:  npm install && npm run build
#   Start Command:  node server/index.js
#   Environment:    NODE_ENV=production

services:
  - type: web
    name: poker-room-pastis
    env: node
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /api/health
    autoDeploy: true
