# render.yaml — Render.com デプロイ設定
#
# 設定方法:
#   1. GitHubにこのリポジトリをプッシュ
#   2. Render.com で "New Web Service" を作成
#   3. リポジトリを選択してこのファイルが自動認識される
#
# 手動設定の場合:
#   Root Directory: (空白 = リポジトリルート)
#   Build Command:  npm install && npm run build
#   Start Command:  node server/index.js
#   Environment:    NODE_ENV=production

services:
  - type: web
    name: poker-room-pastis
    env: node
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # BOT_SERVER: ボットが自サーバーへ接続するURL（NEXTAUTH_URL と同じ値）
      # 未設定の場合は NEXTAUTH_URL 環境変数から自動取得するため、
      # Render の環境変数に NEXTAUTH_URL=https://draw-poker.onrender.com が
      # 設定されていれば BOT_SERVER の設定は不要
    healthCheckPath: /api/health
    autoDeploy: true
